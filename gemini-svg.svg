<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- The Void -->
    <rect width="512" height="512" rx="60" fill="#030303"/>
    
    <!-- Deep Aura Glow -->
    <circle cx="256" cy="256" r="200" fill="url(#void_glow)" opacity="0.4"/>

    <!-- Sharp Crescent (The Aeony Edge) -->
    <path d="M400 256C400 335.531 335.531 400 256 400C176.469 400 112 335.531 112 256C112 176.469 176.469 112 256 112" 
          stroke="#8a2be2" stroke-width="8" stroke-dasharray="15 10"/>

    <!-- The Aggressive "W" Bolt -->
    <!-- This is a custom geometric shape that looks like a fractured 'W' and a lightning bolt -->
    <path d="M120 180L180 420L256 260L332 420L392 180" 
          stroke="url(#electric_grad)" stroke-width="45" stroke-linejoin="miter" stroke-linecap="square"/>
    
    <!-- Core White Heat (Inner Bolt) -->
    <path d="M120 180L180 420L256 260L332 420L392 180" 
          stroke="white" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square" opacity="0.9"/>

    <!-- Glitch Spark -->
    <rect x="380" y="150" width="40" height="8" fill="#00d4ff">
        <animate attributeName="opacity" values="1;0;1" dur="0.2s" repeatCount="indefinite" />
    </rect>

    <defs>
        <radialGradient id="void_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(200)">
            <stop stop-color="#8a2be2"/>
            <stop offset="1" stop-color="#030303" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="electric_grad" x1="120" y1="180" x2="392" y2="420" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00d4ff"/>
            <stop offset="0.5" stop-color="#8a2be2"/>
            <stop offset="1" stop-color="#00d4ff"/>
        </linearGradient>
    </defs>
</svg>
